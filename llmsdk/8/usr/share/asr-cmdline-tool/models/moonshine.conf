# Moonshine-Tiny. No config yaml: run_moonshine_asr.sh pins the asset layout, so no ASR_PRE_ARGS.
# Assets come from the moonshine-tiny inference package (download + push), not from the image.
# Candidates match the wrapper's own lookup order: the package's Yocto location first, then the
# adb/scp dev location. First existing dir wins.
ASR_BIN=run_moonshine_asr.sh
ASR_ASSETS=/usr/share/llm/moonshine-tiny:/root/moonshine-tiny
