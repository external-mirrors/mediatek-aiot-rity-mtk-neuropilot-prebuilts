# Whisper-base 8w16a ASR. Assets come from the whisper-base-8w16a inference package
# (download + push, ~129 MB), not from the image. Candidates: the package's Yocto location first,
# then the adb/scp dev location.
ASR_BIN=main_whisper
ASR_PRE_ARGS=/usr/share/llm-cmdline-tool/config_whisper_base_8w16a.yaml
ASR_ASSETS=/usr/share/llm/whisper-base-8w16a:/root/whisper-base-8w16a
