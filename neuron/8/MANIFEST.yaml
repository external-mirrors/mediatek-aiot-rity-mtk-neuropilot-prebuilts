# Build provenance for the binaries in this directory. Records only what
# cannot be recovered from the artifacts themselves.
#
# repo_commit is ground truth: the commit of THIS repo that last changed those
# files. upstream_commit is transcribed from Release.md and is NOT verified
# against the upstream repo. See ../../VERSIONING.md for the convention.

component: neuron
target: np8
soc: MT8390 / MT8395 / MT8391 / MT8366 / MT8894

upstream:
  repo: aiot_int/bsp/neuron-pilot-dev
  branch: NP8_0

groups:
  - files: [usr/lib64/libneuronusdk_runtime.mtk.so.8.2.16,
            usr/lib64/libneuronusdk_adapter.mtk.so.8.2.16]
    repo_commit: Change-Id I17cc706c4ed701b26192652da1ce59e52355ef2d
    # NOTE: SHA is assigned when Gerrit submits; `git log -1 -- <file>` gives it.
    upstream_commit: 83f5cfad000d6773757fe527e8d6f86b4f4a07e4   # neuropilot_aiv/neuron NP8_0
    recipe: aiot_int/bsp/neuron-pilot-dev NP8_0 @ fef5adc7d1e486d7e05d8800f73dc665d4e99f01,
      recipes-ml/libneuron/libneuron_8.0.bb; patches 0004-0006 added in 8fbcf8d99290
    verified: yes   # built from these exact revisions by bitbake, not transcribed
    deviation: gridsample-mvpu
    # Adds adapter support for ONNX GridSample (-> MVPU GridSampler2d) and
    # fixes a general MVPU-backend GenKernels-failure/IO-placement bug. See
    # deviations.gridsample-mvpu below.

  - files: [usr/sbin/neuronrt, usr/sbin/runtime_api_sample]
    repo_commit: 36bd7f8
    upstream_commit: unknown
    verified: no

  - files: [usr/include/neuron/api/*.h]
    repo_commit: 4dfe322
    upstream_commit: unknown
    verified: no

# NOTE: no commit in neuron/8's entire history records an upstream SHA, and
# neuron/8 has never had a Release.md entry. Every drop since 3ec389c
# (2025-08-25) landed without provenance, so there is nothing to transcribe -
# this is a real gap, not a transcription failure.
#
# Do not reuse 3b031cab1f here. That SHA is recorded in 7574b42, which touched
# mdw/android15 only and no file under neuron/8; it is that component's
# provenance. See ../../mdw/android15/MANIFEST.yaml.
#
# Fill the sbin/header groups in at the next drop.

deviations:
  gridsample-mvpu:
    binaries: [usr/lib64/libneuronusdk_runtime.mtk.so.8.2.16, usr/lib64/libneuronusdk_adapter.mtk.so.8.2.16]
    what: >-
      Adapter: new MapGridSample2D (argString MTKEXT_GRID_SAMPLE_2D) lowers
      ONNX GridSample to nir::GridSampler2DLayer, wrapped in NCHW<->NHWC
      transposes with the ONNX [-1,1]->pixel grid affine done in the adapter
      (MVPU samples absolute pixel coords and has no alignCorners field).
      MVPU backend (BuildTileJobPass, LowerNirToCommandInfoPass,
      NetworkDeepFusionPass): a GenKernels() failure now fails compile
      instead of silently returning an unwritten output, and fusion I/O
      tensors whose op sets io_to_l1=false are placed in DRAM instead of L1.
      Both additive/defensive; no existing op mapping changed, and the
      backend fix only affects MVPU (MT8894 only in this repo).
      Pairs with mvpu/25's libmvpuop25_mtk_{cv,nn}.so update (same drop).
    known_residual: >-
      fp16 absolute-coord grid sampling loses precision for H/W >= 200
      (cos 0.997 @ 200px, 0.994 @ 300px). Needs an fp32-grid kernel binary;
      not fixed here.
    verified_on: Genio Pro 5100 EVK (MT8894/MVPU2.5), see
      gp5100_npu/mvpu_info/gridsample-5100-candidate-1004/README.md (v6);
      SVE-free rebuild is candidate-1005 (README v7), same source.

toolchain: clang 20.1.1   # adapter/runtime (readelf -p .comment); 36bd7f8's drop was clang 18.1.8
target_isa: -march=armv8-a+crc
# These two libs ship to every SoC above, and MT8391/G720 (A78+A55) has no SVE.
# Build them with a v8 machine tune (e.g. MACHINE=genio-720-evk), never in a
# genio-pro-5100-evk/armv9a tree: -march=armv9-a emits SVE -> SIGILL on G720
# (d2f5bf8 shipped ~49k/~25k SVE insns). Check before every drop:
#   llvm-objdump -d <lib> | grep -ic 'st1w\|ptrue\|z[0-9]\+\.[sdbh]'   # must be 0

api:
  headers: usr/include/neuron/api
  # Consumers that dlopen the runtime compile against these. This is the ABI
  # that llmsdk/8/MANIFEST.yaml's built_against.neuron_api points at, and what
  # `make check-abi` watches.
  runtime_soname: libneuronusdk_runtime.mtk.so.8
  adapter_soname: libneuronusdk_adapter.mtk.so.8

# NOTE: no ncc-tflite here - NP8 model compilation is not done on target.
